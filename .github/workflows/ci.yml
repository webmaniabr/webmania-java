name: Installed Java candidate
# This execution qualifies SDKs only in local Docker.
# Hosted execution requires a separate explicit manual dispatch.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-jar-and-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and install candidate into isolated repository
        run: mvn -B -ntp -Dmaven.repo.local=.maven-local clean install
      - name: Prepare verifier plugin dependencies
        run: |
          mvn -B -ntp -Dmaven.repo.local=.maven-local dependency:build-classpath -DincludeScope=test
          mvn -B -ntp -Dmaven.repo.local=.maven-local -f examples/consumer/pom.xml dependency:resolve-plugins package dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
      - name: Verify installed JAR over HTTP and TLS
        run: python3 scripts/run_candidate_tests.py --repository .maven-local --evidence target/qualification/installed
      - name: Verify empty Maven consumer
        run: python3 scripts/verify_consumer.py --repository .maven-local --evidence target/qualification/consumer
